<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Library Checker — Browser Test Runner</title>
  <style>
    body { font-family: monospace; background: #0f172a; color: #f8fafc; padding: 20px; }
    h1 { color: #60a5fa; }
    .pass { color: #34d399; }
    .fail { color: #f87171; }
    .log-item { margin: 4px 0; }
  </style>
</head>
<body>
  <h1>Chicago Public Library Checker — Browser Unit Tests</h1>
  <div id="output">Running tests...</div>

  <script src="../sheet.js"></script>
  <script src="../library.js"></script>
  <script>
    (async function() {
      const output = document.getElementById('output');
      output.innerHTML = '';

      function log(msg, isPass) {
        const div = document.createElement('div');
        div.className = 'log-item ' + (isPass === true ? 'pass' : (isPass === false ? 'fail' : ''));
        div.textContent = msg;
        output.appendChild(div);
      }

      try {
        const searchFixture = await (await fetch('fixtures/roth_everyman_search.json')).json();
        const checkedOutFixture = await (await fetch('fixtures/checked_out_availability.json')).json();
        const availableFixture = await (await fetch('fixtures/available_copy_availability.json')).json();

        log('Test 1: Checked Out copy at target branch (categorized as AVAILABLE for supplier ordering)');
        const availMap1 = new Map();
        availMap1.set('S126C2706764', LibraryUtils.parseAvailabilityResponse(checkedOutFixture, 'S126C2706764'));
        const res1 = LibraryUtils.evaluateBookAvailability({ title: 'Everyman', author: 'Roth' }, [{ id: 'S126C2706764', title: 'Everyman', format: 'BK', pubYear: '2006' }], availMap1, ['Little Italy']);
        log('  ' + (res1.status === 'AVAILABLE' ? '✅ PASS' : '❌ FAIL') + ': Status = ' + res1.status, res1.status === 'AVAILABLE');

        log('Test 2: Available copy at target branch');
        const availMap2 = new Map();
        availMap2.set('S126C2702542', LibraryUtils.parseAvailabilityResponse(availableFixture, 'S126C2702542'));
        const res2 = LibraryUtils.evaluateBookAvailability({ title: 'Everyman', author: 'Roth' }, [{ id: 'S126C2702542', title: 'Everyman', format: 'BK', pubYear: '2006' }], availMap2, ['Little Italy']);
        log('  ' + (res2.status === 'AVAILABLE' ? '✅ PASS' : '❌ FAIL') + ': Status = ' + res2.status, res2.status === 'AVAILABLE');

        log('Test 3: Selected branch has no items');
        const res3 = LibraryUtils.evaluateBookAvailability({ title: 'Everyman', author: 'Roth' }, [{ id: 'S126C2702542', title: 'Everyman', format: 'BK', pubYear: '2006' }], availMap2, ['Albany Park']);
        log('  ' + (res3.status === 'NOT AT BRANCH' ? '✅ PASS' : '❌ FAIL') + ': Status = ' + res3.status, res3.status === 'NOT AT BRANCH');

        log('Test 4: Column guessing');
        const g1 = SheetUtils.guessColumns(['Author Name', 'Title']);
        log('  ' + (g1.titleCol === 1 && g1.authorCol === 0 ? '✅ PASS' : '❌ FAIL') + ': Title=' + g1.titleCol + ' Author=' + g1.authorCol, g1.titleCol === 1 && g1.authorCol === 0);

        log('Test 5: Branch matching exact vs substring');
        const bm1 = LibraryUtils.isBranchMatch('North Austin', 'Austin');
        log('  ' + (!bm1 ? '✅ PASS: North Austin does not match target Austin' : '❌ FAIL'), !bm1);

        log('All browser unit tests finished!');
      } catch (err) {
        log('Error running tests: ' + err.message, false);
      }
    })();
  </script>
</body>
</html>
